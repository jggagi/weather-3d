<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="380" cy="350" r="180" fill="#fbbf24" opacity="0.3" filter="url(#blur)"/>
  <!-- Sun -->
  <circle cx="380" cy="350" r="120" fill="#fbbf24"/>
  <circle cx="380" cy="350" r="100" fill="#fcd34d"/>
  <!-- Cloud back -->
  <ellipse cx="600" cy="520" rx="200" ry="80" fill="white" opacity="0.6"/>
  <ellipse cx="530" cy="480" rx="120" ry="90" fill="white" opacity="0.7"/>
  <!-- Cloud front -->
  <ellipse cx="580" cy="540" rx="220" ry="90" fill="white" opacity="0.9"/>
  <ellipse cx="500" cy="500" rx="140" ry="100" fill="white" opacity="0.95"/>
  <ellipse cx="650" cy="510" rx="130" ry="80" fill="white" opacity="0.85"/>
  <!-- Rain drops -->
  <line x1="470" y1="650" x2="460" y2="720" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="540" y1="660" x2="530" y2="740" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="610" y1="645" x2="600" y2="715" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="680" y1="640" x2="670" y2="700" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
</svg>
